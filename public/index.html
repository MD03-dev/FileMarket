<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FileMarket V2</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#f5f7fb;
 --card:#fff;
 --text:#111827;
 --muted:#6b7280;
 --line:#e5e7eb;
 --primary:#635bff;
 --primary2:#8b5cf6;
 --danger:#ef4444;
 --good:#16a34a;
}
body.dark{
 --bg:#0b1020;
 --card:#121a2d;
 --text:#f5f7ff;
 --muted:#a9b1c5;
 --line:#26314a;
}
body{
 margin:0;
 font-family:Inter,Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 transition:.2s;
}
button,input,textarea,select{
 font:inherit;
}
button{
 border:0;
 cursor:pointer;
}
.top{
 position:sticky;
 top:0;
 z-index:50;
 backdrop-filter:blur(15px);
 background:color-mix(in srgb,var(--card) 88%,transparent);
 border-bottom:1px solid var(--line);
}
.nav{
 max-width:1250px;
 margin:auto;
 display:flex;
 align-items:center;
 gap:12px;
 padding:14px 18px;
}
.logo{
 font-size:22px;
 font-weight:900;
 background:linear-gradient(90deg,#635bff,#ec4899,#06b6d4);
 color:transparent;
 background-clip:text;
}
.search{
 flex:1;
 padding:12px 16px;
 border:1px solid var(--line);
 border-radius:14px;
 background:var(--bg);
 color:var(--text);
 outline:none;
}
.btn{
 padding:10px 14px;
 border-radius:12px;
 background:var(--primary);
 color:#fff;
 font-weight:700;
}
.btn.secondary{
 background:var(--card);
 color:var(--text);
 border:1px solid var(--line);
}
.btn.danger{background:var(--danger)}
.btn.good{background:var(--good)}
.wrap{
 max-width:1250px;
 margin:auto;
 padding:24px 18px 70px;
}
.hero{
 padding:50px 30px;
 border-radius:28px;
 color:white;
 background:linear-gradient(120deg,#312e81,#635bff,#db2777);
 box-shadow:0 20px 50px #0002;
}
.hero h1{
 font-size:clamp(32px,6vw,64px);
 margin:0 0 10px;
}
.hero p{
 opacity:.9;
 font-size:18px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
 gap:16px;
 margin-top:20px;
}
.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:20px;
 overflow:hidden;
 box-shadow:0 10px 30px #0000000a;
}
.cardbody{padding:16px}
.productimg{
 width:100%;
 height:180px;
 object-fit:cover;
 background:linear-gradient(135deg,#1e1b4b,#7c3aed);
}
.pill{
 display:inline-block;
 padding:5px 9px;
 border-radius:999px;
 background:#635bff1c;
 color:#635bff;
 font-size:12px;
 font-weight:800;
 margin:2px;
}
.verified{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 width:18px;
 height:18px;
 border-radius:50%;
 background:#1677ff;
 color:white;
 font-size:11px;
 font-weight:900;
 vertical-align:middle;
}
.price{
 font-size:22px;
 font-weight:900;
 margin:8px 0;
}
.muted{color:var(--muted)}
.row{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 align-items:center;
}
.modal{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:100;
 display:none;
 align-items:center;
 justify-content:center;
 padding:18px;
}
.modal.show{display:flex}
.modalbox{
 width:min(900px,100%);
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 border:1px solid var(--line);
 border-radius:24px;
 padding:22px;
}
input,textarea,select{
 width:100%;
 padding:11px 13px;
 border-radius:12px;
 border:1px solid var(--line);
 background:var(--bg);
 color:var(--text);
 margin:6px 0 10px;
}
textarea{min-height:110px;resize:vertical}
label{
 font-size:13px;
 font-weight:800;
}
.section{
 margin-top:28px;
}
.section h2{margin-bottom:8px}
.tabs{
 display:flex;
 gap:8px;
 overflow:auto;
 padding:8px 0;
}
.tab{
 white-space:nowrap;
 padding:9px 13px;
 border-radius:12px;
 background:var(--card);
 border:1px solid var(--line);
 color:var(--text);
}
.tab.active{
 background:var(--primary);
 color:white;
}
.adminShell{
 display:grid;
 grid-template-columns:230px 1fr;
 min-height:calc(100vh - 65px);
}
.side{
 border-right:1px solid var(--line);
 padding:18px;
 background:var(--card);
}
.side button{
 width:100%;
 text-align:left;
 margin:4px 0;
 background:transparent;
 color:var(--text);
 padding:12px;
 border-radius:10px;
}
.side button:hover{background:var(--bg)}
.adminmain{padding:25px}
.statgrid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
 gap:14px;
}
.stat{
 background:var(--card);
 border:1px solid var(--line);
 padding:18px;
 border-radius:18px;
}
.stat b{
 display:block;
 font-size:28px;
 margin-top:6px;
}
.chat{
 display:grid;
 grid-template-columns:230px 1fr;
 height:560px;
 border:1px solid var(--line);
 border-radius:18px;
 overflow:hidden;
}
.chatlist{
 border-right:1px solid var(--line);
 background:var(--card);
 overflow:auto;
}
.chatitem{
 padding:13px;
 border-bottom:1px solid var(--line);
 cursor:pointer;
}
.chatitem:hover{background:var(--bg)}
.chatmain{
 display:flex;
 flex-direction:column;
}
.messages{
 flex:1;
 padding:15px;
 overflow:auto;
}
.msg{
 max-width:75%;
 padding:10px 13px;
 border-radius:14px;
 margin:6px 0;
 background:var(--bg);
}
.msg.mine{
 margin-left:auto;
 background:#635bff;
 color:white;
}
.chatinput{
 padding:10px;
 border-top:1px solid var(--line);
 display:flex;
 gap:8px;
}
.chatinput input{margin:0}
.empty{
 padding:35px;
 text-align:center;
 color:var(--muted);
}
@media(max-width:750px){
 .adminShell{grid-template-columns:1fr}
 .side{
  border-right:0;
  border-bottom:1px solid var(--line);
  display:flex;
  overflow:auto;
 }
 .side button{min-width:max-content}
 .chat{grid-template-columns:1fr}
 .chatlist{display:none}
 .nav .search{display:none}
}
</style>
</head>

<body>

<div id="app"></div>

<div id="modal" class="modal">
 <div class="modalbox">
  <div id="modalContent"></div>
 </div>
</div>

<script>
const $=s=>document.querySelector(s);

let state={
 user:null,
 products:[],
 product:null,
 cart:[],
 favorites:[],
 chats:[],
 activeChat:null
};

function money(n){
 return Number(n||0).toLocaleString("vi-VN")+"đ";
}

function esc(x){
 return String(x??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;");
}

async function api(url,opt={}){
 const headers={
  ...(opt.body instanceof FormData
   ? {}
   : {"Content-Type":"application/json"}),
  ...(opt.headers||{})
 };

 const r=await fetch(url,{
  ...opt,
  credentials:"same-origin",
  headers
 });

 const text=await r.text();

 let d={};

 try{
  d=text?JSON.parse(text):{};
 }catch{
  d={
   error:text||("HTTP "+r.status)
  };
 }

 if(!r.ok){
  throw new Error(
   d.error||("HTTP "+r.status)
  );
 }

 return d;
}

function openModal(html){
 $("#modalContent").innerHTML=html;
 $("#modal").classList.add("show");
}

function closeModal(){
 $("#modal").classList.remove("show");
}

$("#modal").onclick=e=>{
 if(e.target.id==="modal")closeModal();
};

function verified(u){
 return u&&u.verified
  ?'<span class="verified">✓</span>'
  :"";
}

async function load(){
 try{
  state.user=(await api("/api/me")).user;
 }catch{}

 state.products=await api("/api/products");

 if(state.user){
  try{state.cart=await api("/api/cart")}catch{}
  try{state.favorites=await api("/api/favorites")}catch{}
 }

 render();
}

function canSellerUpload(){
 return !!(
  state.user &&
  state.user.role==="seller" &&
  state.user.sellerStatus==="approved"
 );
}
function nav(){
 return `
 <div class="top">
  <div class="nav">
   <div class="logo" onclick="home()" style="cursor:pointer">
    FileMarket
   </div>

   <input class="search"
    id="search"
    placeholder="Tìm file, template, source code, tài liệu..."
    onkeydown="if(event.key==='Enter')searchProducts()">

   <button class="btn secondary" onclick="toggleDark()">🌙</button>
   <button class="btn secondary" onclick="openAuth()">
    ${canSellerUpload()?`
 <button class="btn good" onclick="openUploadProduct()">
  ➕ Đăng sản phẩm
 </button>`:""}${state.user?esc(state.user.name):"Đăng nhập"}
   </button>

   ${state.user?`
    <button class="btn secondary" onclick="fmToggleWallet()">
     🪙 ${Number(state.user.coins||0).toLocaleString("vi-VN")}
    </button>
   `:""}
   <button class="btn secondary" onclick="openCart()">🛒 ${state.cart?.length||0}</button>
  </div>
 </div>
 `;
}

function home(){
 location.href="/";
}

async function searchProducts(){
 const q=$("#search")?.value||"";
 state.products=await api("/api/products?q="+encodeURIComponent(q));
 render();
}

function render(){
 if(location.pathname==="/admin"){
  renderAdmin();
  return;
 }

 $("#app").innerHTML=`
 ${nav()}
 <main class="wrap">
  <section class="hero">
   <h1>Digital Marketplace.</h1>
   <p>Mua · Bán · Chia sẻ file kỹ thuật số.</p>
   <div class="row">
    <button class="btn" onclick="openAuth()">Bắt đầu ngay</button>
    <button class="btn secondary" onclick="openSeller()">🏪 Trở thành Shop</button>
   </div>
  </section>

  <section class="section">
   <div class="row" style="justify-content:space-between">
    <div>
     <h2>Sản phẩm</h2>
     <div class="muted">FileMarket V2</div>
    </div>
    <button class="btn secondary" onclick="load()">↻ Làm mới</button>
   </div>

   <div class="grid">
    ${state.products.map(productCard).join("")}
   <section class="section">
    <div class="row" style="justify-content:space-between">
     <div>
      <h2>🧑‍💻 Bán tài khoản</h2>
      <div class="muted">Các tài khoản đang được Shop đăng bán</div>
     </div>
    </div>

    <div class="grid">
     ${
      state.products.filter(p=>
       String(p.category||"").toLowerCase()==="tài khoản"
      ).length
      ?
      state.products
       .filter(p=>
        String(p.category||"").toLowerCase()==="tài khoản"
       )
       .map(productCard)
       .join("")
      :
      '<div class="empty">Chưa có tài khoản được đăng bán.</div>'
     }
    </div>
   </section>
   </div>
  </section>

  ${state.user?`
   <section class="section">
    <h2>Tài khoản</h2>
    <div class="row">
     <button class="btn secondary" onclick="openOrders()">📦 Đơn hàng</button>
     <button class="btn secondary" onclick="openFavorites()">❤️ Yêu thích</button>
     <button class="btn secondary" onclick="openChats()">💬 Chat</button>
     <button class="btn secondary" onclick="openNotifications()">🔔 Thông báo</button>
     ${state.user.role==="seller"?
      `<button class="btn secondary" onclick="openSellerDash()">🏪 Seller Dashboard</button>`:""}
     <button class="btn danger" onclick="logout()">Đăng xuất</button>
    </div>
   </section>
  `:""}

  <section class="section">
   <h2>Admin</h2>
   <button class="btn secondary" onclick="location.href='/admin'">
    👑 Trang quản trị
   </button>
  </section>
 </main>
 `;
}

function productCard(p){
 const img=p.images?.[0];

 return `
 <div class="card">
  ${img?
   `<img class="productimg" src="${img}">`:
   `<div class="productimg"></div>`
  }

  <div class="cardbody">
   <div class="row">
    <span class="pill">${esc(p.category)}</span>
    ${p.mode==="free"?'<span class="pill">FREE</span>':""}
   </div>

   <h3>${esc(p.name)}</h3>

   <div class="muted">
    Shop:
    <b>${esc(p.sellerName)}</b>
    ${p.sellerVerified?'<span class="verified">✓</span>':""}
   </div>

   <div>⭐ ${p.rating||0} · ${p.reviews||0} đánh giá</div>   <div class="price">
    ${p.mode==="free"?"Miễn phí":money(p.price)}
   </div>

   <div class="row">
    <button class="btn" onclick="openProduct('${p.id}')">Xem</button>
    <button class="btn secondary" onclick="fav('${p.id}')">❤️</button>
    <button class="btn secondary" onclick="cart('${p.id}')">🛒</button>
   </div>
  </div>
 </div>
 `;
}

async function openProduct(id){
 const d=await api("/api/products/"+id);
 const p=d.product;
 state.product = p;

 openModal(`
  <div class="row" style="justify-content:space-between">
   <h2>${esc(p.name)}</h2>
   <div class="cardbody" style="margin:12px 0">
     <label>M&#227; Voucher</label>
     <input
      id="purchaseVoucher"
      placeholder="Nh&#7853;p m&#227; gi&#7843;m gi&#225;"
      maxlength="30"
      style="width:100%;text-transform:uppercase"
     >
     <small>Voucher s&#7869; &#273;&#432;&#7907;c &#225;p d&#7909;ng tr&#432;&#7899;c khi tr&#7915; Coin.</small>
    </div>
   <button class="btn secondary" onclick="closeModal()">✕</button>
  </div>

  ${p.images?.length?
   `<div class="grid">
    ${p.images.map(x=>`<img class="productimg" src="${x}">`).join("")}
   </div>`:""}

  ${p.video?
   `<video controls style="width:100%;max-height:400px;border-radius:16px">
    <source src="${p.video}">
   </video>`:""}

  <p>${esc(p.description)}</p>

  <div class="row">
   <span class="pill">${esc(p.category)}</span>
   <span class="pill">${esc(p.format||"FILE")}</span>
   <span class="pill">v${esc(p.version)}</span>
   <span class="pill">${formatSize(p.fileSize)}</span>
  </div>

  <h3>
   Shop:
   ${esc(p.sellerName)}
   ${p.sellerVerified?'<span class="verified">✓</span>':""}
  </h3>

  <div class="row">
   ${(p.mode||"sell")!=="free"?
    `<button class="btn" onclick="buy('${p.id}')">💰 Mua ${money(p.price)}</button>`:""}

   ${p.mode==="free"?
    `<button class="btn good" onclick="buy('${p.id}')">🆓 Tải miễn phí</button>`:""}

   <button class="btn secondary" onclick="cart('${p.id}')">🛒 Giỏ hàng</button>

   ${state.user?
    `<button class="btn secondary"
     onclick="chatShop('${p.sellerId}')">💬 Chat Shop</button>`:""}
  </div>

  <hr>

  <h3>Đánh giá</h3>

  ${d.reviews.length?
   d.reviews.map(r=>`
    <div class="cardbody" style="border-bottom:1px solid var(--line)">
     <b>${esc(r.user?.name||"User")}</b>
     ${verified(r.user)}
     <div>⭐ ${r.rating}</div>
     <div>${esc(r.text||"")}</div>
    </div>
   `).join(""):
   '<div class="empty">Chưa có đánh giá</div>'
  }

  ${state.user?
   `<h3>Viết đánh giá</h3>
    <select id="rating">
     <option value="5">5 ⭐</option>
     <option value="4">4 ⭐</option>
     <option value="3">3 ⭐</option>
     <option value="2">2 ⭐</option>
     <option value="1">1 ⭐</option>
    </select>
    <textarea id="reviewText" placeholder="Nhận xét..."></textarea>
    <button class="btn" onclick="review('${p.id}')">Gửi đánh giá</button>`:""}
 `);
}

function formatSize(n){
 n=Number(n||0);
 if(n<1024)return n+" B";
 if(n<1024**2)return (n/1024).toFixed(1)+" KB";
 if(n<1024**3)return (n/1024**2).toFixed(1)+" MB";
 return (n/1024**3).toFixed(2)+" GB";
}

async function buy(id){
 if(!state.user)return openAuth();

 try{

  /* Lấy Voucher người mua nhập */
  const voucherCode=String(
   document.getElementById("purchaseVoucher")?.value||""
  ).trim().toUpperCase();

  const d=await api("/api/orders",{
   method:"POST",
   body:JSON.stringify({
    productId:id,
    voucherCode
   })
  });

  if(d.order.status==="paid"){

   /* Cập nhật Coin ngay */
   if(typeof d.coins!=="undefined"){
    state.user.coins=Number(d.coins||0);
   }

   closeModal();

   /* Reload để:
      - cập nhật Coin
      - account vừa bán biến mất
      - cập nhật danh sách sản phẩm
   */
   await load();

   alert(
    d.order.discountAmount>0
     ? "Mua thành công! Đã áp dụng giảm "+money(d.order.discountAmount)+" và trừ Coin."
     : "Mua thành công! Coin đã được trừ."
   );

   return;
  }

  payment(d.order,d.payment);

 }catch(e){
  alert(e.message);
 }
}
function payment(order,settings){
 openModal(`
  <h2>💳 Thanh toán</h2>

  <p>
   Mã đơn:
   <b>${esc(order.id)}</b>
  </p>

  <h3>${money(order.amount)}</h3>

  <div class="cardbody">
   <b>${esc(settings.bankName)}</b><br>
   STK: <b>${esc(settings.bankAccount)}</b><br>
   Chủ TK: <b>${esc(settings.bankOwner)}</b><br><br>
   Nội dung:
   <b>${esc(order.id)}</b>
  </div>

  <p class="muted">
   ${esc(settings.paymentNote)}
  </p>

  <button class="btn" onclick="closeModal();alert('Sau khi chuyển khoản, Admin sẽ xác nhận đơn để mở quyền tải.')">
   Tôi đã chuyển khoản
  </button>
 `);
}

async function cart(id){
 if(!state.user)return openAuth();

 await api("/api/cart/toggle",{
  method:"POST",
  body:JSON.stringify({productId:id})
 });

 state.cart=await api("/api/cart");

 alert("Đã cập nhật giỏ hàng");
 render();
}

function openCart(){
 if(!state.user)return openAuth();

 openModal(`
  <h2>🛒 Giỏ hàng</h2>
  ${state.cart.length?
   state.cart.map(productCard).join(""):
   '<div class="empty">Giỏ hàng trống</div>'}
 `);
}

async function fav(id){
 if(!state.user)return openAuth();

 await api("/api/favorites/toggle",{
  method:"POST",
  body:JSON.stringify({productId:id})
 });

 alert("Đã cập nhật yêu thích");
}

async function openFavorites(){
 if(!state.user)return openAuth();

 state.favorites=await api("/api/favorites");

 openModal(`
  <h2>❤️ Yêu thích</h2>
  <div class="grid">
   ${state.favorites.length?
    state.favorites.map(productCard).join(""):
    '<div class="empty">Chưa có sản phẩm yêu thích</div>'}
  </div>
 `);
}

function openAuth(){
 openModal(`
  <h2>🔐 Tài khoản</h2>

  <h3>Đăng nhập</h3>

  <input id="loginEmail" type="email" placeholder="Email" autocomplete="off">
  <input id="loginPass" type="password" placeholder="Mật khẩu" autocomplete="new-password">

  <button class="btn" onclick="login()">Đăng nhập</button>

  <hr>

  <h3>Đăng ký</h3>

  <input id="regName" placeholder="Tên">
  <input id="regEmail" placeholder="Email">
  <input id="regPass" type="password" placeholder="Mật khẩu tối thiểu 6 ký tự">

  <button class="btn secondary" onclick="register()">Tạo tài khoản</button>
 `);
}

async function login(){
 const email=$("#loginEmail")?.value.trim();
 const password=$("#loginPass")?.value;

 if(!email||!password){
  return alert("Nhập email và mật khẩu.");
 }

 try{
  const d=await api("/api/login",{
   method:"POST",
   body:JSON.stringify({
    email,
    password
   })
  });

  state.user=d.user||null;

  closeModal();

  await load();

  alert("Đăng nhập thành công!");

 }catch(e){
  alert("Đăng nhập thất bại: "+e.message);
 }
}

async function register(){
 const name=$("#regName")?.value.trim();
 const email=$("#regEmail")?.value.trim();
 const password=$("#regPass")?.value;

 if(!name||!email||!password){
  return alert("Nhập đầy đủ thông tin.");
 }

 if(password.length<6){
  return alert("Mật khẩu phải có ít nhất 6 ký tự.");
 }

 try{
  const d=await api("/api/register",{
   method:"POST",
   body:JSON.stringify({
    name,
    email,
    password
   })
  });

  state.user=d.user||null;

  closeModal();

  await load();

  alert("Tạo tài khoản thành công!");

 }catch(e){
  alert("Đăng ký thất bại: "+e.message);
 }
}

function openChangePassword(){
 if(!state.user)return openAuth();

 openModal(`
  <div class="row" style="justify-content:space-between">
   <h2>🔑 Đổi mật khẩu</h2>
   <button class="btn secondary" onclick="closeModal()">✕</button>
  </div>

function toggleAccountFields(){
 const select=$("#accountCategory");
 const box=$("#accountFields");
 const fileInput=$("#productFileInput");

 if(!select || !box) return;

 const isAccount = select.value === "Tài khoản";

 box.style.display = isAccount ? "block" : "none";

 const username = box.querySelector('[name="accountUsername"]');
 const password = box.querySelector('[name="accountPassword"]');

 if(username) username.required = isAccount;
 if(password) password.required = isAccount;

 // San pham tai khoan khong can file.
 if(fileInput){
  fileInput.required = !isAccount;
 }
}

async function createVoucher(){
 const code=String($("#voucherCode")?.value||"")
  .trim()
  .toUpperCase();

 const percent=Number($("#voucherPercent")?.value||0);
 const maxUses=Number($("#voucherMaxUses")?.value||0);

 if(!code){
  return alert("Nhập mã Voucher.");
 }

 if(!/^[A-Z0-9_-]{3,30}$/.test(code)){
  return alert("Mã Voucher chỉ dùng A-Z, 0-9, _ hoặc - và dài 3-30 ký tự.");
 }

 if(!Number.isInteger(percent)||percent<1||percent>100){
  return alert("Phần trăm giảm phải từ 1 đến 100.");
 }

 if(!Number.isInteger(maxUses)||maxUses<0){
  return alert("Số lượt sử dụng không hợp lệ.");
 }

 try{
  await api("/api/admin/vouchers",{
   method:"POST",
   body:JSON.stringify({
    code,
    percent,
    maxUses,
    active:true
   })
  });

  alert("Đã tạo Voucher.");
  adminVouchers();

 }catch(e){
  alert(e.message);
 }
}

    <b>Mã giao dịch:</b>
    ${esc(d.topup.reference)}<br><br>

    <b>Số tiền:</b>
    ${Number(d.topup.amount).toLocaleString("vi-VN")}đ<br><br>

    ${bankHtml}

    <br>
    <b>Nội dung:</b><br>
    ${esc(d.payment.note)}
    <br><br>

    <span class="muted">
     Sau khi hệ thống/admin xác nhận,
     Coin sẽ được cộng tự động.
    </span>
   </div>
  `;

 }catch(e){
  alert(e.message);
 }
}

async function fmCardTopup(){
 try{
  const network=
   document.getElementById("fmCardNetwork").value;

  const amount=
   Number(document.getElementById("fmCardAmount").value);

  const serial=
   document.getElementById("fmCardSerial").value.trim();

  const code=
   document.getElementById("fmCardCode").value.trim();

  if(!serial||!code){
   return alert("Nhập serial và mã thẻ.");
  }

  const d=await api("/api/topups/card",{
   method:"POST",
   body:JSON.stringify({
    network,
    amount,
    serial,
    code
   })
  });

  document.getElementById("fmCardResult").innerHTML=`
   <div class="fm-wallet-card">
    Trạng thái:
    <b>${esc(d.status||"pending")}</b><br>
    ${esc(d.message||"Đã ghi nhận giao dịch.")}
   </div>
  `;

  fmWalletLoad();

 }catch(e){
  alert(e.message);
 }
}

async function fmZaloStart(){
 try{
  const amount=Number(
   document.getElementById("fmZaloAmount").value
  );

  if(amount<1000){
   return alert("Tối thiểu 1.000đ.");
  }

  /*
   ZaloPay cần Merchant API credentials thật.
   Endpoint callback đã được chuẩn bị ở backend.
  */

  document.getElementById("fmZaloResult").innerHTML=`
   <div class="fm-wallet-card">
    Giao dịch ZaloPay cần được cấu hình
    Merchant API trên server trước khi tạo
    payment URL/QR thật.
   </div>
  `;

 }catch(e){
  alert(e.message);
 }
}

/* Tự cập nhật Coin sau khi trang load */
setTimeout(()=>{
 if(state.user){
  fmWalletLoad();
 }
},800);

async function saveWithdrawSettings(){
 try{
  await api("/api/admin/settings",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    withdrawFeePercent:Number(
     document.getElementById("fmWithdrawFee")?.value||10
    ),
    coinToVnd:Number(
     document.getElementById("fmCoinRate")?.value||1
    ),
    maxWithdrawals7d:Number(
     document.getElementById("fmWithdrawLimit")?.value||2
    )
   })
  });

  alert("Đã lưu cài đặt rút tiền");
 }catch(e){
  alert(e.message);
 }
}
</script>
